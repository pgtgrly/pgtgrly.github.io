# Site settings
title: Pranav Garg
email: pranavgarg@gmail.com
url: https://pranavgarg.in
google_analytics: G-0W3ZYHZYXP
description: "GSoCer. Amazonian. Aspiring Polymath."

# Color settings (hex-codes without the leading hash-tag)
color:
  primary-dark: '#000000'
  links: '#39ff14'

# Footer settings
footer: Pranav Garg

# Social networks usernames (many more available: google-plus, flickr, dribbble, pinterest, instagram, tumblr, linkedin, etc.)
social:
  - title: twitter
    url: https://twitter.com/pgtgrly
  - title: linkedin
    url: https://in.linkedin.com/in/pranavgarg1997
  - title: github
    url: https://github.com/pgtgrly
# Build settings
markdown: kramdown
permalink: pretty
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Apple and Google read these from the dot folder, which Jekyll skips by default.
include:
  - .well-known

# Design records for the site's own tools; not pages. Listing Jekyll's usual excludes too, in case this list replaces them.
exclude:
  - PRODUCT.md
  - DESIGN.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
